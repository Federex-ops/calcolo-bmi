<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="margin: 0; font-size: 28px; font-weight: 700">Calcolatore BMI</h1> 
    <form style="width: 360px; box-sizing: border-box; background: #FFFFFF; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 16px"> 
        <div style="display: flex; flex-direction: column; gap: 6px"> 
            <label for="nome" style="font-size: 14px; font-weight: 600">Nome</label> 
            <input id="nome" type="text" placeholder="Luca" style="height: 44px; box-sizing: border-box; padding: 0 12px; font-size: 16px; font-family: inherit; border: 1px solid #C9CED4; border-radius: 8px"> 
        </div> <div style="display: flex; flex-direction: column; gap: 6px"> 
            <label for="peso" style="font-size: 14px; font-weight: 600">Peso (kg)</label> 
            <input id="peso" type="number" placeholder="70" style="height: 44px; box-sizing: border-box; padding: 0 12px; font-size: 16px; font-family: inherit; border: 1px solid #C9CED4; border-radius: 8px"> </div> 
            <div style="display: flex; flex-direction: column; gap: 6px"> 
                <label for="altezza" style="font-size: 14px; font-weight: 600">Altezza (cm)</label> 
                <input id="altezza" type="number" placeholder="178" style="height: 44px; box-sizing: border-box; padding: 0 12px; font-size: 16px; font-family: inherit; border: 1px solid #C9CED4; border-radius: 8px"> </div> 
                <button type="button" style="margin-top: 8px; height: 44px; border: none; border-radius: 8px; background: #1F2328; color: #FFFFFF; font-size: 16px; font-weight: 600; font-family: inherit">Calcola</button> 
            </form>
</body>
</html>
